# Nixpacks Configuration for Astro
# Ref: https://nixpacks.com/docs/configuration/file

[phases.setup]
nixPkgs = ["bun", "nodejs_22"]
# The nixpkgs snapshot of this nixpacks version ships bun 1.3.0, which fails
# integrity + native-optional handling on the bun 1.4.x lockfile. Pin the
# same bun the repo was developed with (1.4.2) and shadow it via PATH order.
cmds = [
  "curl -fsSL https://github.com/oven-sh/bun/releases/download/bun-v1.4.2/bun-linux-x64.zip -o /tmp/bun.zip",
  "unzip -o -q /tmp/bun.zip -d /tmp",
  "install -m755 /tmp/bun-linux-x64/bun /usr/local/bin/bun",
  "bun --version",
]

[phases.install]
cmds = ["bun install --frozen-lockfile"]

[phases.build]
cmds = ["bun run build"]

[start]
cmd = "bun run preview --host 0.0.0.0 --port ${PORT:-3000}"
